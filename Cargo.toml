[package]
name = "monster-step-viewer"
version = "0.1.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "mstpv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = "1"
bevy = { version = "0.18", default-features = false, features = [
    "3d_bevy_render",
    "default_app",
    "default_platform",
    "picking",
] }
bevy_egui = "0.39"
bevy_editor_cam = "0.8"
futures-lite = "2"
env_logger = "0.11"
glam = "0.32"
log = "0.4"
parking_lot = "0.12"
rayon = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ehttp = "0.7"
monstertruck = { git = "https://github.com/virtualritz/monstertruck.git", features = [
    "step",
    "meshing",
    "solid",
    "modeling",
] }

# meshopt wraps the C++ meshoptimizer library. Keep it native-only for now;
# the wasm build still gets indexed meshes, just without the
# vertex-cache/vertex-fetch reordering.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meshopt = "0.6"
# NSI live rendering (3Delight). Optional, native-only. Pins the same git rev as
# akatela's NSI integration, which we model the BRep export on.
nsi = { git = "https://github.com/virtualritz/nsi.git", features = ["output"], optional = true }
crossbeam = { version = "0.8", optional = true }

[features]
default = []
# Writes standalone `.nsi` files. Native-only and independent from live
# rendering.
nsi-export = []
# Renders trimmed NURBS surfaces via 3Delight (NSI) and overlays the result
# in the viewport. Native-only; requires 3Delight installed locally
# (`/usr/local/3delight/...` or `$DELIGHT`).
nsi-render = ["dep:nsi", "dep:crossbeam"]

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
